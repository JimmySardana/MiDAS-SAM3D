[project]
name = "sam3d_objects"
version = "0.0.1"
dependencies = ["pyvista", "lightning", "dataclasses", "MoGe@git+https://github.com/microsoft/MoGe.git@a8c37341bc0325ca99b9d57981cc3bb2bd3e255b", "gsplat", "spconv-cu121", "loguru", "timm", "matplotlib", "open3d", "trimesh", "optree", "astor", "easydict", "opencv-python", "scipy", "plyfile", "xatlas", "igraph", "pymeshfix"]

[tool.setuptools.packages.find]
include = ["sam3d_objects"]

[project.optional-dependencies]
server = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2",
]